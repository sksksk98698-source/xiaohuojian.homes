<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
    <defs>
        <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0E1017" />
            <stop offset="100%" stop-color="#181B26" />
        </linearGradient>
        <linearGradient id="accent-grad" x1="200" y1="100" x2="1000" y2="500" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FF4D36" />
            <stop offset="50%" stop-color="#FF7A00" />
            <stop offset="100%" stop-color="#8B5CF6" />
        </linearGradient>
    </defs>
    <rect width="1200" height="630" fill="url(#bg-grad)" />
    
    <!-- Pulse Line Graphic -->
    <path d="M100 480 H350 L470 280 L600 520 L720 360 L800 480 H1100" stroke="url(#accent-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
    
    <g transform="translate(100, 160)">
        <rect width="180" height="42" rx="21" fill="#FF4D36" fill-opacity="0.15" />
        <text x="90" y="27" text-anchor="middle" fill="#FF5733" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">CREATIVE STUDIO</text>
        
        <text x="0" y="120" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800">Studio Pulse</text>
        <text x="0" y="180" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400">Brand Strategy · Creative Direction · Digital Craft</text>
    </g>
</svg>
